name: Build executables

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: executable-builds-${{ github.event.release.tag_name }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows executables
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pinned toolchains
        uses: jdx/mise-action@v4
        with:
          version: 2026.7.13
          cache: true

      - name: Enable compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.16.0

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
          cache-targets: "false"
          cache-bin: "false"

      - name: Locate pnpm store
        id: pnpm-store
        shell: pwsh
        run: |
          $store = pnpm store path --silent
          "path=$store" >> $env:GITHUB_OUTPUT

      - name: Cache frontend dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Build release executables
        run: |
          cargo build --release -p trace-desktop --bin trace
          cargo build --release -p trace-ac --example capture_fixture

      - name: Attach Windows executables to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}"
          target/release/trace.exe
          target/release/examples/capture_fixture.exe
          --clobber

      - name: Upload Windows executables
        uses: actions/upload-artifact@v7
        with:
          name: trace-windows-x86_64-${{ github.sha }}
          path: |
            target/release/trace.exe
            target/release/examples/capture_fixture.exe
          if-no-files-found: error
          retention-days: 14
