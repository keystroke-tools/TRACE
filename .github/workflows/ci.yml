name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Install pinned toolchains
        uses: jdx/mise-action@v4
        with:
          version: 2026.7.13
          cache: true

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-ci

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        run: pnpm check

      - name: Build frontend
        run: pnpm build

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace --all-features

  windows-ac-boundary:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pinned toolchains
        uses: jdx/mise-action@v4
        with:
          version: 2026.7.13
          cache: true

      - name: Enable compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.16.0

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
          cache-targets: "false"
          cache-bin: "false"

      - name: Locate pnpm store
        id: pnpm-store
        shell: pwsh
        run: |
          $store = pnpm store path --silent
          "path=$store" >> $env:GITHUB_OUTPUT

      - name: Cache frontend dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Check Assetto Corsa acquisition boundary
        run: cargo check -p trace-windows-shmem -p trace-ac

      - name: Test Windows storage and acquisition boundaries
        run: cargo test -p trace-storage -p trace-recorder -p trace-ac

      - name: Check Windows desktop shell
        if: github.event_name == 'pull_request'
        run: cargo check -p trace-desktop

      - name: Warm Windows release compiler cache
        if: github.event_name == 'push'
        run: |
          cargo build --release -p trace-desktop --bin trace
          cargo build --release -p trace-ac --example capture_fixture
