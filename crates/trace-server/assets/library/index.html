<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#151515" />
		<meta name="robots" content="noindex, nofollow" />
		<meta name="description" content="Your private, self-hosted TRACE telemetry library." />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="stylesheet" href="/trace-assets/theme.css?v=__TRACE_VERSION__" />
		<link rel="stylesheet" href="/app-assets/library.css?v=__TRACE_VERSION__" />
		<link rel="stylesheet" href="/app-assets/library-admin.css?v=__TRACE_VERSION__" />
		<title>TRACE Library</title>
	</head>
	<body>
		<header class="topbar">
			<a class="brand" href="/"><strong>TRACE</strong><span>//</span><small>LIBRARY</small></a>
			<div class="instance"><span id="instance-name">Connecting…</span><small id="instance-version"></small></div>
		</header>

		<main>
			<section id="loading-view" class="state-panel">
				<span class="spinner" aria-hidden="true"></span>
				<p>Connecting to this TRACE instance…</p>
			</section>

			<section id="auth-view" class="auth-layout" hidden>
				<div id="auth-root" class="auth-root"></div>
			</section>

			<section id="library-view" hidden>
				<div id="library-home">
					<div id="account-shell-root"></div>
					<div id="admin-panel" class="token-panel admin-panel" hidden></div>

					<div id="session-library-root"></div>
				</div>

				<div id="review-view" hidden>
					<div id="review-header-root"></div>
					<div id="share-panel-root"></div>
					<div id="comparison-summary-root"></div>

					<div id="compare-picker-root"></div>

					<div class="review-layout">
						<aside class="lap-panel">
							<div id="review-laps-root"></div>
						</aside>
						<section id="telemetry-workspace-root" class="telemetry-panel"></section>
					</div>
				</div>
			</section>
		</main>

		<div id="toast-region" class="toast-region" aria-live="polite"></div>
		<script src="/app-assets/library-admin.js?v=__TRACE_VERSION__" defer></script>
	</body>
</html>
