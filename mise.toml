[tools]
node = "26.5.0"
pnpm = "11.17.0"
rust = { version = "1.91.1", profile = "minimal", components = "clippy,rustfmt" }

[settings]
experimental = true

[env]
MISE_CACHE_DIR = "{{config_root}}/.cache/mise"

[tasks.install]
description = "Install project toolchains and package dependencies"
run = "pnpm install --frozen-lockfile"

[tasks.format]
description = "Format the Rust and frontend workspaces"
run = [
  "cargo fmt --all",
  "pnpm --if-present format",
]

[tasks.check]
description = "Run project verification"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets --all-features -- -D warnings",
  "cargo test --workspace --all-features",
  "pnpm --if-present check",
  "pnpm --if-present build",
]

[tasks.dev-live-service]
description = "Run the local TRACE Go Live service"
run = "cargo run -p trace-server"

[tasks.bench-storage]
description = "Benchmark Arrow IPC storage codecs at target sample rates"
run = "cargo run --release -p trace-storage --example arrow_benchmark"

[tasks.build-ac-fixture-collector]
description = "Cross-compile the privacy-redacted AC fixture collector for Windows"
tools = { "cargo:cargo-xwin" = "0.23.1", clang = "22.1.8" }
run = "cargo xwin build --target x86_64-pc-windows-msvc -p trace-ac --example capture_fixture --release"

[tasks.build-windows-desktop]
description = "Build a runnable Windows TRACE desktop executable from Linux"
tools = { "cargo:cargo-xwin" = "0.23.1", "conda:lld" = "22.1.8", "conda:llvm-tools" = "22.1.8", clang = "22.1.8" }
run = [
  "pnpm build",
  "cargo xwin build --target x86_64-pc-windows-msvc -p trace-desktop --bin trace --release",
]

[tasks.run-windows-desktop]
description = "Build and launch the TRACE Windows desktop app from WSL"
depends = ["build-windows-desktop"]
run = "powershell.exe -NoProfile -Command \"Start-Process -FilePath '$(wslpath -w '{{config_root}}/target/x86_64-pc-windows-msvc/release/trace.exe')'\""
