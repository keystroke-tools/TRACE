[workspace]
resolver = "3"
members = [
  "apps/desktop/src-tauri",
  "crates/trace-adapter",
  "crates/trace-ac",
  "crates/trace-core",
  "crates/trace-domain",
  "crates/trace-protocol",
  "crates/trace-recorder",
  "crates/trace-storage",
  "crates/trace-windows-shmem",
]

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "MIT"
rust-version = "1.91"

[workspace.dependencies]
arrow-array = "59.1.0"
arrow-ipc = { version = "59.1.0", features = ["lz4", "zstd"] }
arrow-schema = "59.1.0"
serde = { version = "1.0.219", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.10.9"
tauri = "2.11.5"
tauri-build = "2.6.3"
time = { version = "0.3.55", features = ["formatting"] }
trace-domain = { path = "crates/trace-domain" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
