<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>TRACE // INPUT TELEMETRY</title>
		<style>
			* {
				box-sizing: border-box;
			}
			html,
			body {
				width: 100%;
				height: 100%;
				margin: 0;
				overflow: hidden;
				background: transparent;
				color: #fff;
				font-family:
					Inter,
					Segoe UI,
					sans-serif;
			}
			#overlay {
				--thr: #31d576;
				--brk: #db4b4b;
				--clt: #4b9fe8;
				--str: #f2f4f3;
				height: 100%;
				overflow: hidden;
				border: 1px solid #343434;
			}
			main {
				display: grid;
				height: 100%;
				grid-template-columns: minmax(120px, 62fr) minmax(54px, 12fr) minmax(90px, 26fr);
				gap: 7px;
				padding: 6px;
				background: #151515;
			}
			.graph {
				position: relative;
				min-width: 0;
				background: #0f0f0f;
			}
			canvas {
				width: 100%;
				height: 100%;
			}
			.pedals {
				display: flex;
				min-width: 54px;
				justify-content: center;
				gap: 3px;
			}
			.pedal {
				display: flex;
				width: 16px;
				flex: none;
				flex-direction: column;
				align-items: center;
				gap: 5px;
			}
			.bar {
				position: relative;
				min-height: 64px;
				width: 100%;
				max-width: 16px;
				flex: 1;
				overflow: hidden;
				background: #0b0b0b;
			}
			.fill {
				position: absolute;
				inset: auto 0 0;
				height: 0;
				background: var(--color);
				opacity: 0.9;
			}
			.short {
				color: #ffffff99;
				font-size: 9px;
				font-weight: 900;
			}
			.value {
				font:
					700 10px Consolas,
					monospace;
			}
			.steering {
				display: flex;
				min-width: 90px;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 5px;
			}
			.wheel {
				min-height: 0;
				width: 100%;
				max-width: 124px;
				flex: 1;
			}
			.steering-value {
				color: var(--str);
				font:
					700 10px Consolas,
					monospace;
			}
			.hide {
				display: none !important;
			}
		</style>
	</head>
	<body>
		<div id="overlay">
			<main>
				<section class="graph">
					<canvas></canvas>
				</section>
				<section class="pedals">
					<div class="pedal" data-field="throttlePercent">
						<div class="bar"><div class="fill" style="--color: var(--thr)"></div></div>
						<span class="short">T</span><span class="value">0</span>
					</div>
					<div class="pedal" data-field="brakePercent">
						<div class="bar"><div class="fill" style="--color: var(--brk)"></div></div>
						<span class="short">B</span><span class="value">0</span>
					</div>
					<div class="pedal clutch" data-field="clutchPercent">
						<div class="bar"><div class="fill" style="--color: var(--clt)"></div></div>
						<span class="short">C</span><span class="value">0</span>
					</div>
				</section>
				<section class="steering">
					<svg class="wheel" viewBox="0 0 100 100">
						<circle cx="50" cy="50" r="38" fill="#000" fill-opacity=".32" stroke="#000" stroke-opacity=".42" stroke-width="7" />
						<g id="wheel">
							<path d="M46 10h8v9h-8z" fill="var(--str)" />
						</g></svg
					><span class="steering-value">0°</span>
				</section>
			</main>
		</div>
		<script>
			const params = new URLSearchParams(location.search);
			const root = document.querySelector("#overlay");
			const historySeconds = Math.max(2, Math.min(10, Number(params.get("history")) || 6));
			const graphWidth = Math.max(30, Math.min(82, Number(params.get("graphWidth")) || 62));
			const overlayWidth = 540;
			const overlayHeight = Math.max(100, Math.min(280, Number(params.get("height")) || 180));
			const radius = Math.max(0, Math.min(24, Number(params.get("radius")) || 8));
			const horizontalGrid = params.get("horizontalGrid") !== "0";
			const verticalGrid = params.get("verticalGrid") !== "0";
			const colours = {
				throttle: params.get("throttle") || "#31d576",
				brake: params.get("brake") || "#db4b4b",
				clutch: params.get("clutchColor") || "#4b9fe8",
				steering: params.get("steeringColor") || "#f2f4f3",
			};
			root.style.setProperty("--thr", colours.throttle);
			root.style.setProperty("--brk", colours.brake);
			root.style.setProperty("--clt", colours.clutch);
			root.style.setProperty("--str", colours.steering);
			root.style.width = `${overlayWidth}px`;
			root.style.height = `${overlayHeight}px`;
			root.style.borderRadius = `${radius}px`;
			document.querySelectorAll(".graph,.pedals,.steering").forEach((panel) => (panel.style.borderRadius = `${Math.max(0, radius - 3)}px`));
			const hex = (params.get("background") || "#151515").replace("#", "");
			const opacity = Math.max(0, Math.min(100, Number(params.get("opacity")) || 100)) / 100;
			root.style.background = `rgba(${parseInt(hex.slice(0, 2), 16)},${parseInt(hex.slice(2, 4), 16)},${parseInt(hex.slice(4, 6), 16)},${opacity})`;
			if (params.get("graph") === "0") document.querySelector(".graph").classList.add("hide");
			if (params.get("clutch") === "0") document.querySelectorAll(".clutch").forEach((el) => el.classList.add("hide"));
			if (params.get("steering") === "0") document.querySelector(".steering").classList.add("hide");
			if (params.get("values") === "0") document.querySelectorAll(".short,.value,.steering-value").forEach((el) => el.classList.add("hide"));
			const main = document.querySelector("main");
			main.style.gridTemplateColumns = `minmax(120px,${graphWidth}fr) minmax(54px,12fr) minmax(90px,${Math.max(10, 88 - graphWidth)}fr)`;
			const visible = [...main.children].filter((el) => !el.classList.contains("hide"));
			if (visible.length < 3) main.style.gridTemplateColumns = visible.length === 1 ? "1fr" : "minmax(220px,1fr) minmax(112px,.35fr)";
			const history = [];
			let lastSequence = null;
			async function poll() {
				try {
					const data = await fetch("/api/overlays/pedals", { cache: "no-store" }).then((response) => response.json());
					update(data);
				} catch {}
				setTimeout(poll, 33);
			}
			function update(data) {
				document.querySelectorAll(".pedal").forEach((pedal) => {
					const value = Math.max(0, Math.min(100, Number(data[pedal.dataset.field]) || 0));
					pedal.querySelector(".fill").style.height = `${value}%`;
					pedal.querySelector(".value").textContent = Math.round(value);
				});
				const steering = Number(data.steeringDegrees) || 0;
				document.querySelector("#wheel").style.transform = `rotate(${Math.max(-180, Math.min(180, -steering))}deg)`;
				document.querySelector("#wheel").style.transformOrigin = "50px 50px";
				document.querySelector(".steering-value").textContent = `${steering > 0 ? "+" : ""}${Math.round(steering)}°`;
				if (data.sequence !== lastSequence) {
					const now = performance.now() / 1000;
					history.push({ ...data, time: now });
					while (history[0]?.time < now - historySeconds - 0.25) history.shift();
					lastSequence = data.sequence;
					draw();
				}
			}
			function draw() {
				const canvas = document.querySelector("canvas");
				const box = canvas.getBoundingClientRect();
				const scale = devicePixelRatio || 1;
				canvas.width = Math.max(1, box.width * scale);
				canvas.height = Math.max(1, box.height * scale);
				const context = canvas.getContext("2d");
				context.scale(scale, scale);
				context.lineCap = "round";
				context.lineJoin = "round";
				context.lineWidth = 1;
				if (horizontalGrid) {
					context.strokeStyle = "#ffffff18";
					for (let y = 1; y < 4; y++) {
						context.beginPath();
						context.moveTo(0, (box.height * y) / 4);
						context.lineTo(box.width, (box.height * y) / 4);
						context.stroke();
					}
				}
				if (verticalGrid) {
					context.strokeStyle = "#ffffff10";
					for (let x = 1; x < 4; x++) {
						context.beginPath();
						context.moveTo((box.width * x) / 4, 0);
						context.lineTo((box.width * x) / 4, box.height);
						context.stroke();
					}
				}
				const end = history.at(-1)?.time || historySeconds;
				[
					["throttlePercent", colours.throttle],
					["brakePercent", colours.brake],
					["clutchPercent", colours.clutch],
				].forEach(([field, color]) => {
					if (field === "clutchPercent" && params.get("clutch") === "0") return;
					context.beginPath();
					context.strokeStyle = color;
					context.lineWidth = 2.5;
					history.forEach((sample, index) => {
						const x = ((sample.time - (end - historySeconds)) / historySeconds) * box.width;
						const y = box.height - (Math.max(0, Math.min(100, Number(sample[field]) || 0)) / 100) * (box.height - 4) - 2;
						index ? context.lineTo(x, y) : context.moveTo(x, y);
					});
					context.stroke();
				});
			}
			addEventListener("resize", draw);
			poll();
		</script>
	</body>
</html>
