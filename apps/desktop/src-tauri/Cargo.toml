[package]
name = "trace-desktop"
description = "TRACE desktop composition root"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "trace_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "trace"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
futures-util.workspace = true
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde.workspace = true
serde_json = "1.0.145"
sha2.workspace = true
tauri.workspace = true
tauri-plugin-dialog = "2.7.2"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
time.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-native-roots"] }
trace-ac = { path = "../../../crates/trace-ac" }
trace-adapter = { path = "../../../crates/trace-adapter" }
trace-core = { version = "0.4.0", path = "../../../crates/trace-core" }
trace-domain.workspace = true
trace-live = { path = "../../../crates/trace-live" }
trace-protocol = { path = "../../../crates/trace-protocol" }
trace-recorder = { path = "../../../crates/trace-recorder" }
trace-storage = { path = "../../../crates/trace-storage" }
zip = { version = "8.4.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true
